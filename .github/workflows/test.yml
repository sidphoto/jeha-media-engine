name: JEHA CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: M1 pipeline smoke test
        run: python scripts/run_daily_pipeline.py --run-id ci-m1

      - name: Verify M1 approval gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("data/runs/ci-m1/run_summary.json").read_text())
          assert summary["final_status"] == "AWAITING_APPROVAL", summary
          PY

      - name: M2 intelligence fixture smoke test
        run: python scripts/run_intelligence_pipeline.py --run-id ci-m2 --mode fixture

      - name: Verify M2 evidence, benchmark and approval gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("data/runs/ci-m2")
          summary = json.loads((root / "run_summary.json").read_text())
          top5 = json.loads((root / "top5.json").read_text())
          benchmark = json.loads((root / "youtube_benchmark.json").read_text())
          patterns = json.loads((root / "benchmark_patterns.json").read_text())
          production_spec = json.loads((root / "production_spec.json").read_text())
          assert summary["raw_evidence_count"] >= 50, summary
          assert summary["candidate_count"] == 20, summary
          assert summary["shortlist_count"] == 5, summary
          assert summary["benchmark_sample_count"] == 12, summary
          assert summary["benchmark_products"] == 4, summary
          assert summary["final_status"] == "AWAITING_APPROVAL", summary
          assert len(top5) == 5
          assert len(benchmark) == 12
          assert set(patterns) == {"flow_room", "moon_room", "cozy_room", "nature_room"}
          advisory = production_spec["metadata"]["youtube_benchmark"]
          assert advisory["advisory_only"] is True, advisory
          assert advisory["product"] == production_spec["product"], advisory
          print("M2 benchmark fixture pipeline verified")
          PY

      - name: M3 asset fixture smoke test
        run: python scripts/run_asset_pipeline.py data/runs/ci-m2/production_spec.json --run-id ci-m3 --mode fixture

      - name: Verify M3 asset lineage and approval gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("data/asset_runs/ci-m3")
          summary = json.loads((root / "run_summary.json").read_text())
          assets = json.loads((root / "assets.json").read_text())
          qa = json.loads((root / "qa_report.json").read_text())
          assert summary["pipeline_version"] == "M3", summary
          assert summary["mode"] == "fixture", summary
          assert summary["asset_count"] >= 2, summary
          assert summary["qa_passed"] is True, summary
          assert summary["final_status"] == "AWAITING_APPROVAL", summary
          assert qa["passed"] is True, qa
          assert {asset["asset_type"] for asset in assets}.issuperset({"music", "visual"})
          assert len({asset["asset_id"] for asset in assets}) == len(assets)
          assert all(asset["qa_status"] == "passed" for asset in assets)
          assert all(asset["production_spec_ref"].endswith("production_spec.json") for asset in assets)
          print("M3 fixture pipeline verified")
          PY

      - name: Create CI-only explicit M3 approval record
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pipeline.assembly import asset_bundle_fingerprint
          bundle_path = Path("data/asset_runs/ci-m3/asset_bundle.json")
          bundle = json.loads(bundle_path.read_text())
          approval = {
              "decision": "approved",
              "approver": "ci-fixture-human-gate",
              "approved_at": "2026-08-18T00:00:00+00:00",
              "asset_bundle_hash": asset_bundle_fingerprint(bundle),
          }
          Path("data/asset_runs/ci-m3/approval.json").write_text(json.dumps(approval, indent=2) + "\n")
          PY

      - name: M4.1 approval-bound assembly smoke test
        run: >-
          python scripts/run_assembly_plan.py
          data/asset_runs/ci-m3/asset_bundle.json
          data/runs/ci-m2/production_spec.json
          data/asset_runs/ci-m3/approval.json
          --run-id ci-m4

      - name: Verify M4.1 render plan and human gate lineage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("data/render_runs/ci-m4")
          plan = json.loads((root / "render_plan.json").read_text())
          summary = json.loads((root / "run_summary.json").read_text())
          approved = json.loads((root / "approved_asset_bundle.json").read_text())
          assert plan["final_status"] == "READY_FOR_RENDER", plan
          assert summary["pipeline_version"] == "M4.1", summary
          assert summary["final_status"] == "READY_FOR_RENDER", summary
          assert approved["final_status"] == "APPROVED", approved
          assert plan["approval"]["decision"] == "approved", plan
          assert plan["approval"]["asset_bundle_hash"] == plan["source_bundle_hash"], plan
          assert plan["lineage"]["music_id"].startswith("MUSIC-"), plan
          assert plan["lineage"]["visual_id"].startswith("VISUAL-"), plan
          assert plan["video_id"].startswith("VIDEO-"), plan
          print("M4.1 approval-bound render planning verified")
          PY
