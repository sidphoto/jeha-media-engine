name: M1 CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Pipeline smoke test
        run: python scripts/run_daily_pipeline.py --run-id ci-test

      - name: Verify approval gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("data/runs/ci-test/run_summary.json").read_text())
          assert summary["final_status"] == "AWAITING_APPROVAL", summary
          print("final_status=AWAITING_APPROVAL")
          PY
